[package]
name = "aero-hashes"
description = "Aero hashing functions"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["mem_size", "std", "workflow"]
mem_size = ["aero-utils/mem_size"]
std = ["blake2b_simd/std", "blake3/std", "borsh/std", "faster-hex/std", "js-sys?/std", "aero-utils/std", "serde/std", "sha2/std", "wasm-bindgen/std"]
workflow = ["std", "dep:workflow-wasm", "dep:js-sys"]
zerocopy = ["dep:zerocopy"]

[dependencies]
blake2b_simd.workspace = true
blake3 = { workspace = true }
borsh.workspace = true
faster-hex.workspace = true
js-sys = { workspace = true, optional = true }
aero-utils = { workspace = true, default-features = false }
serde.workspace = true
sha2.workspace = true
sha2-const-stable.workspace = true
wasm-bindgen.workspace = true
workflow-wasm = { workspace = true, optional = true }
zerocopy = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
rand.workspace = true

[[bench]]
name = "bench"
harness = false

[lints]
workspace = true

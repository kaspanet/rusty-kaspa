smallvec.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
workflow-perf-monitor.workspace = true

[dev-dependencies]
criterion.workspace = true
rand = { workspace = true, features = ["small_rng"] }
tokio = { workspace = true, features = ["rt", "macros", "process"] }
aero-txscript-errors.workspace = true
# Enable the small-chunk feature only in test builds so integration tests can
# exercise the SMT chunk / flow-control path without requiring thousands of lanes.
aero-p2p-flows = { workspace = true, features = ["test-smt-small-chunks"] }

[features]
heap = ["dhat"]
html_reports = []
devnet-prealloc = ["aerod/devnet-prealloc"]

[lints]
workspace = true

[package]
name = "kaspa-consensus-core"
description = "Kaspa consensus core"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[features]
devnet-prealloc = []
wasm32-sdk = []
default = []

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
borsh.workspace = true
bitflags.workspace = true
cfg-if.workspace = true
faster-hex.workspace = true
futures-util.workspace = true
getrandom.workspace = true
itertools.workspace = true
js-sys.workspace = true
kaspa-addresses.workspace = true
kaspa-core.workspace = true
kaspa-hashes = { workspace = true, features = ["mem_size"] }
kaspa-math.workspace = true
kaspa-smt.workspace = true
kaspa-merkle.workspace = true
kaspa-muhash.workspace = true
kaspa-txscript-errors.workspace = true
kaspa-utils.workspace = true
rand.workspace = true
secp256k1.workspace = true
serde-value.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
thiserror.workspace = true
wasm-bindgen.workspace = true
workflow-core.workspace = true
workflow-log.workspace = true
workflow-serializer.workspace = true
workflow-wasm.workspace = true

# workflow-serializer brings ahash, which pulls getrandom 0.3; its wasm32 builds
# need the `wasm_js` backend feature (the backend cfg is set in the workspace
# .cargo/config.toml).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
criterion.workspace = true
bincode.workspace = true
serde_yaml = "0.9"
toml.workspace = true
wasm-bindgen-test.workspace = true
web-sys.workspace = true

[[bench]]
name = "serde_benchmark"
harness = false

[[bench]]
name = "tx_id_bench"
harness = false

[lints]
workspace = true

[package]
name = "aero-p2p-flows"
description = "Aero p2p flows"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aero-core.workspace = true
aero-consensus-core.workspace = true
aero-consensus-notify.workspace = true
aero-p2p-lib.workspace = true
aero-p2p-mining.workspace = true
aero-utils = { workspace = true, features = ["fd_budget"]}
aero-utils-tower.workspace = true
aero-hashes.workspace = true
aero-muhash.workspace = true
aero-seq-commit.workspace = true
aero-smt.workspace = true
aero-connectionmanager.workspace = true
aero-addressmanager.workspace = true
aero-consensusmanager.workspace = true
aero-mining.workspace = true
aero-notify.workspace = true

async-trait.workspace = true
futures = { workspace = true, features = ["alloc"] }
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
semver.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = { workspace = true, features = ["net"] }
uuid = { workspace = true, features = ["v4", "fast-rng"] }
chrono.workspace = true

[features]
# Lowers `SMT_CHUNK_SIZE` and `SMT_FLOW_CONTROL_WINDOW` to tiny values so
# integration tests can exercise the chunked / flow-controlled SMT IBD path
# without generating tens of thousands of active lanes.
test-smt-small-chunks = []

[lints]
workspace = true

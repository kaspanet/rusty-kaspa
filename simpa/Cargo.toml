[package]
name = "simpa"
description = "Aero Network Simulator"
publish = false
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aero-alloc.workspace = true            # This changes the global allocator for all of the next dependencies so should be kept first
aero-consensus-core.workspace = true
aero-consensus-notify.workspace = true
aero-consensus.workspace = true
aero-core.workspace = true
aero-database.workspace = true
aero-hashes.workspace = true
aero-perf-monitor.workspace = true
aero-utils.workspace = true

async-channel.workspace = true
cfg-if.workspace = true
clap.workspace = true
dhat = { workspace = true, optional = true }
futures-util.workspace = true
futures.workspace = true
flate2.workspace = true
indexmap.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus.workspace = true
rand_distr.workspace = true
rand.workspace = true
rayon.workspace = true
secp256k1.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
serde_json.workspace = true
serde.workspace = true
faster-hex.workspace = true
aero-testing-integration.workspace = true

[dev-dependencies]
aero-consensus = { workspace = true, features = ["test-smt-pruning-diagnostics"] }
aero-smt-store = { workspace = true, features = ["test-smt-pruning-diagnostics"] }

[features]
heap = ["dhat", "aero-alloc/heap"]
semaphore-trace = ["aero-utils/semaphore-trace"]
baseline-debugging = ["aero-consensus/baseline-debugging"]

[lints]
workspace = true

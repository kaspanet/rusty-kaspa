[package]
name = "aero-wasm"
description = "AERO WASM bindings"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
repository.workspace = true
# wasm-pack requires this value to be a string
# (it can not be derived from the workspace)
license = "ISC"

[lib]
crate-type = ["cdylib"]

[dependencies]
cfg-if.workspace = true
js-sys.workspace = true
aero-addresses.workspace = true
aero-bip32.workspace = true
aero-consensus-core.workspace = true
aero-consensus-wasm.workspace = true
aero-core.workspace = true
aero-math.workspace = true
aero-pow.workspace = true
aero-txscript.workspace = true
aero-txscript-zk-sdk.workspace = true
aero-rpc-core.workspace = true
aero-utils.workspace = true
aero-wasm-core.workspace = true
aero-wallet-core.workspace = true
aero-wallet-keys.workspace = true
aero-wrpc-client.workspace = true
aero-wrpc-wasm.workspace = true
num.workspace = true
wasm-bindgen.workspace = true
workflow-log.workspace = true
workflow-core.workspace = true
workflow-wasm.workspace = true

[features]
wasm32-sdk = [
    "aero-wallet-core/wasm32-sdk",
    "aero-pow/wasm32-sdk",
    "aero-txscript/wasm32-sdk",
    "aero-txscript-zk-sdk/wasm32-sdk",
]
wasm32-core = [
    "aero-wallet-core/wasm32-core",
    "aero-pow/wasm32-sdk",
    "aero-txscript/wasm32-sdk",
    "aero-txscript-zk-sdk/wasm32-core",
]
wasm32-rpc = [
    "aero-consensus-core/wasm32-sdk",
    "aero-consensus-wasm/wasm32-sdk",
    "aero-wrpc-client/wasm32-sdk",
    "aero-wrpc-wasm/wasm32-sdk",
]
wasm32-keygen = []
default = []

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[package.metadata.emanate.wasm]
targets = [
    { target = "nodejs", out-dir = "nodejs/aero" },
    { target = "web", out-dir = "web/aero" },
]
folder = "setup"

# Workaround for Rust 1.87.0
# https://github.com/rust-lang/rust/issues/141048
[package.metadata.wasm-pack.profile.release]
# This optimization configuration requires "-Ctarget-cpu=mvp" Rustflag (only enable W3C MVP feature set)
# This flag is automatically used either via (release optimized) build script at root
#   or via .cargo/config.toml when executing the build from /wasm
wasm-opt = ["-O","--enable-bulk-memory"]

[lints]
workspace = true

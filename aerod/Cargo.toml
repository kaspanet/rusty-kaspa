[package]
name = "aerod"
description = "Aero full node daemon"
keywords = ["aero", "blockdag"]
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "aerod_lib"
crate-type = ["cdylib", "lib"]

[dependencies]
aero-alloc.workspace = true # This changes the global allocator for all of the next dependencies so should be kept first

aero-addresses.workspace = true
aero-addressmanager.workspace = true
aero-build-info.workspace = true
aero-consensus-core.workspace = true
aero-consensus-notify.workspace = true
aero-consensus.workspace = true
aero-consensusmanager.workspace = true
aero-core.workspace = true
aero-database.workspace = true
aero-grpc-server.workspace = true
aero-hashes.workspace = true
aero-index-processor.workspace = true
aero-mining.workspace = true
aero-notify.workspace = true
aero-p2p-flows.workspace = true
aero-p2p-lib.workspace = true
aero-p2p-mining.workspace = true
aero-perf-monitor.workspace = true
aero-rpc-core.workspace = true
aero-rpc-service.workspace = true
aero-system-info.workspace = true
aero-txscript.workspace = true
aero-utils.workspace = true
aero-utils-tower.workspace = true
aero-utxoindex.workspace = true
aero-wrpc-server.workspace = true

async-channel.workspace = true
cfg-if.workspace = true
clap = { workspace = true, features = ["env"]}
dhat = { workspace = true, optional = true }
dirs.workspace = true
futures-util.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus.workspace = true
rand.workspace = true
rayon.workspace = true
rocksdb.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
workflow-log.workspace = true
serde_json.workspace = true

toml = "0.8.10"
serde_with = "3.7.0"

[features]
heap = ["dhat", "aero-alloc/heap"]
devnet-prealloc = ["aero-consensus/devnet-prealloc"]
semaphore-trace = ["aero-utils/semaphore-trace"]

[lints]
workspace = true

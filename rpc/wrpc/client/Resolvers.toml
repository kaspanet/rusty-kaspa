# Public Aero wRPC resolver list.
#
# Aero has no public resolver yet, so nothing is enabled here. Run your own resolver, or connect to a node
# directly with its wRPC URL. To publish a resolver, set `enable = true` and fill in the template and node names.

[[resolver]]
enable = false
address = "http://127.0.0.1:8888"

[[group]]
enable = false
template = "https://*.example.invalid"
nodes = ["seed1", "seed2"]
